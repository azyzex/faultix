version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    # Major bumps of the toolchain (TypeScript, ESLint, mocha) change lint
    # rules and compiler behaviour, so they need a human deciding when to
    # take them rather than a PR that fails CI on arrival.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
